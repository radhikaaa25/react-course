<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
    <style>
      .on-button {
        background-color: rgb(25, 135, 84);
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
      }

      .off-button {
        background-color: rgb(220, 53, 69);
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      // Define an App component that toggles a button state and style
      function App() {
        // Initialize a state variable to track if the button is ON
        const [isButtonOn, setIsButtonOn] = React.useState(true);

        // Function to toggle the button's ON/OFF state
        function switchButtonOn() {
          if (isButtonOn) {
            setIsButtonOn(false);
          } else {
            setIsButtonOn(true);
          }
          /*
            Another solution is:
            setIsButtonOn(!isButtonOn);
          */
        }

        return (
          <button
            className={isButtonOn ? 'on-button' : 'off-button'}
            onClick={switchButtonOn}
          >
            {isButtonOn ? 'ON' : 'OFF'}
          </button>
        );
      }

      // Get the container element and render the App component inside it
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
