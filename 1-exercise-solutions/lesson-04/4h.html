<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      // Define an App component with a counter and an auto-clicker feature
      function App() {
        // Initialize state for the count and a reference for the button element
        const [count, setCount] = React.useState(0);
        const buttonRef = React.useRef();

        // Function to increment the 'count' state
        function increaseCount() {
          setCount(count + 1);
        }

        // Function to reset the 'count' state
        function resetCount() {
          setCount(0);
        }

        // Function to simulate a click on the button every second
        function autoClick() {
          setInterval(() => {
            const buttonElem = buttonRef.current;
            if (buttonElem) {
              buttonElem.click();
            }
          }, 1000);
        }

        return (
          <>
            <button
              onClick={increaseCount}
              ref={buttonRef}
            >
              Clicked {count} {count === 1 ? 'time' : 'times'}
            </button>
            <button onClick={resetCount}>
              Reset
            </button>
            <button onClick={autoClick}>
              Auto Click
            </button>
          </>
        );
      }

      // Get the container element and render the App component inside it
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
