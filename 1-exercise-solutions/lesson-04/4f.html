<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
    <style>
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      // Define an App component that displays the current time using a side effect
      function App() {
        // Initialize state variable 'time' with the current time
        const [time, setTime] = React.useState(
          dayjs().format('HH:mm:ss')
        );

        // Set up an interval to update the time every second when the component mounts
        React.useEffect(() => {
          setInterval(() => {
            setTime(dayjs().format('HH:mm:ss'));
          }, 1000);

        // Important: make sure to give React.useEffect()
        // a dependency array of [] so it only runs once!
        }, []);

        return (
          <p>Current time: {time}</p>
        );
      }

      // Get the container element and render the App component inside it
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
