<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      // Define a ProductDetails component with an optional discount price
      function ProductDetails({ name, price, discountPrice }) {
        return (
          <>
            <p>{name}</p>
            <p>Price: ${price}</p>
            {discountPrice && (
              <p>Discount price: ${discountPrice}</p>
            )}
            <button>Add to Cart</button>
          </>
        );
      }

      // Define an App component that displays multiple ProductDetails components
      function App() {
        return (
          <>
            <ProductDetails
              name="Cotton socks"
              price="10.90"
              discountPrice="5.45"
            />
            <ProductDetails
              name="Tennis balls"
              price="6.00"
            />
            <ProductDetails
              name="Plain T-Shirt"
              price="7.99"
            />
          </>
        );
      }

      // Get the container element and render the App component inside it
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
